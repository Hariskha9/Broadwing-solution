<header
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [ngClass]="
    scrolled()
      ? 'bg-[#0f172a] shadow-2xl shadow-black/30'
      : 'bg-[#0f172a]/95 backdrop-blur-sm'
  "
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-18 py-3">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-3 group">
        <div class="w-10 h-10 bg-orange-500 rounded-lg flex items-center justify-center shadow-lg group-hover:bg-orange-400 transition-colors">
          <svg viewBox="0 0 40 40" fill="none" class="w-7 h-7" aria-hidden="true">
            <path d="M4 28 L16 12 L28 20 L36 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20 28 C20 28 28 22 36 26" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="8" cy="30" r="3" fill="white"/>
            <circle cx="32" cy="30" r="3" fill="white"/>
          </svg>
        </div>
        <div class="leading-none">
          <span class="font-display text-xl font-bold text-white tracking-wide">BROADWING</span>
          <div class="text-orange-400 text-xs font-semibold tracking-[0.2em] uppercase">Solution</div>
        </div>
      </a>

      <!-- Desktop Nav -->
      <nav class="hidden lg:flex items-center gap-1">
        <ng-container *ngFor="let link of navLinks">
          <!-- Link with Dropdown -->
          <div
            *ngIf="link.hasDropdown; else singleLink"
            class="relative"
            (mouseenter)="servicesOpen.set(true)"
            (mouseleave)="servicesOpen.set(false)"
          >
            <a
              [routerLink]="link.to"
              class="flex items-center gap-1 px-3 py-2 rounded-md text-sm font-medium transition-colors"
              [ngClass]="
                isActive(link.to)
                  ? 'text-orange-400'
                  : 'text-slate-300 hover:text-white hover:bg-white/10'
              "
            >
              {{ link.label }}
              <svg
                class="w-3.5 h-3.5 transition-transform"
                [ngClass]="{ 'rotate-180': servicesOpen() }"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </a>

            <div
              *ngIf="servicesOpen()"
              class="absolute top-full left-0 mt-1 w-72 bg-white rounded-xl shadow-2xl border border-slate-100 p-2 grid grid-cols-1 gap-0.5"
            >
              <a
                *ngFor="let svc of services"
                [routerLink]="['/services', svc.slug]"
                class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-blue-50 hover:text-blue-900 transition-colors group"
              >
                <div class="w-1.5 h-1.5 rounded-full bg-orange-500 flex-shrink-0 group-hover:scale-125 transition-transform"></div>
                {{ svc.title }}
              </a>
            </div>
          </div>

          <!-- Standard Link -->
          <ng-template #singleLink>
            <a
              [routerLink]="link.to"
              class="px-3 py-2 rounded-md text-sm font-medium transition-colors"
              [ngClass]="
                isActive(link.to)
                  ? 'text-orange-400'
                  : 'text-slate-300 hover:text-white hover:bg-white/10'
              "
            >
              {{ link.label }}
            </a>
          </ng-template>
        </ng-container>
      </nav>

      <!-- Desktop CTAs -->
      <div class="hidden lg:flex items-center gap-3">
        <a
          routerLink="/apply"
          class="bg-orange-500 hover:bg-orange-400 text-white text-sm font-bold px-5 py-2.5 rounded-lg transition-all duration-200 hover:shadow-lg hover:shadow-orange-500/25 hover:-translate-y-0.5"
        >
          Sign Up as a Driver
        </a>
        <a
          routerLink="/contact"
          class="border border-slate-600 hover:border-blue-400 text-slate-300 hover:text-white text-sm font-medium px-4 py-2.5 rounded-lg transition-colors"
        >
          Get Started
        </a>
      </div>

      <!-- Mobile Hamburger -->
      <button
        (click)="toggleMobileMenu()"
        class="lg:hidden p-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/10 transition-colors"
        aria-label="Toggle menu"
      >
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            *ngIf="mobileOpen()"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
          <path
            *ngIf="!mobileOpen()"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="mobileOpen()" class="lg:hidden bg-[#111827] border-t border-white/10">
    <nav class="px-4 py-4 space-y-1">
      <div *ngFor="let link of navLinks">
        <a
          [routerLink]="link.to"
          class="block px-4 py-3 rounded-lg text-sm font-medium transition-colors"
          [ngClass]="
            isActive(link.to)
              ? 'bg-blue-900/50 text-orange-400'
              : 'text-slate-300 hover:bg-white/5 hover:text-white'
          "
        >
          {{ link.label }}
        </a>

        <!-- Submenu for services in mobile -->
        <div *ngIf="link.hasDropdown" class="ml-4 mt-1 space-y-0.5">
          <a
            *ngFor="let svc of services | slice:0:6"
            [routerLink]="['/services', svc.slug]"
            class="block px-4 py-2 text-xs text-slate-400 hover:text-slate-200 transition-colors"
          >
            → {{ svc.title }}
          </a>
          <a
            routerLink="/services"
            class="block px-4 py-2 text-xs text-blue-400 hover:text-blue-300 font-medium"
          >
            View all services →
          </a>
        </div>
      </div>

      <div class="pt-3 space-y-2 border-t border-white/10">
        <a
          routerLink="/apply"
          class="block w-full text-center bg-orange-500 hover:bg-orange-400 text-white text-sm font-bold px-4 py-3 rounded-lg transition-colors"
        >
          Sign Up as a Driver
        </a>
        <a
          routerLink="/contact"
          class="block w-full text-center border border-slate-600 text-slate-300 text-sm font-medium px-4 py-3 rounded-lg transition-colors"
        >
          Get Started
        </a>
      </div>
    </nav>
  </div>
</header>
